openapi: 3.0.3
info:
  title: UC Attendance System API
  description: Live API documentation for the InOut attendance backend.
  version: 1.0.0
servers:
  - url: https://uc-attendance-system-1ts2.onrender.com
    description: Production (Render)
  - url: http://localhost:5000
    description: Local development

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []

paths:
  /ping:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        '200':
          description: Server is up

  /version:
    get:
      tags: [Health]
      summary: API build version
      security: []
      responses:
        '200':
          description: Version info

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Returns JWT token and user info

  /auth/register:
    post:
      tags: [Auth]
      summary: Register (pending approval)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string }
                phone: { type: string }
                position: { type: string }
                company: { type: string }
      responses:
        '201':
          description: Registration submitted

  /users:
    get:
      tags: [Users]
      summary: Get all users
      description: >
        Salary, bank account details, and statutory fields (`pan`, `uan`, `esiNumber`,
        `empGrade`) are masked from the response to prevent unauthorized exposure.
        Admins receive full details; employees see their own salary, bank, and statutory
        details only, with other users' sensitive fields omitted or masked (`****`).
        `bankDetails.officeBranch` remains visible for office matching.
      responses:
        '200':
          description: User list

  /users/me:
    get:
      tags: [Users]
      summary: Get logged-in user
      description: Returns the authenticated user's full profile, including salary and bank details.
      responses:
        '200':
          description: Current user

  /users/profile:
    get:
      tags: [Users]
      summary: Get profile
      description: Returns the authenticated user's full profile, including salary and bank details.
      responses:
        '200':
          description: User profile
    put:
      tags: [Users]
      summary: Update profile
      description: >
        Updates the authenticated user's profile. `salary`, `isActive`, and `empGrade`
        are not accepted here (403); admins must use `PUT /users/{id}` or
        `PUT /users/{id}/salary` instead. Employees may update their own `pan`, `uan`,
        and `esiNumber`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Profile updated
        '403':
          description: Attempted to update admin-only fields (salary, isActive, empGrade)

  /users/profile/upload:
    post:
      tags: [Users]
      summary: Upload profile picture
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                profilePic:
                  type: string
                  format: binary
      responses:
        '200':
          description: Upload successful

  /users/letters/upload:
    post:
      tags: [Users]
      summary: Upload letter PDF
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                letter:
                  type: string
                  format: binary
      responses:
        '200':
          description: Letter uploaded

  /users/{id}:
    get:
      tags: [Users]
      summary: Get user by ID (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: User details
    put:
      tags: [Users]
      summary: Update user (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: User updated

  /users/{id}/salary:
    put:
      tags: [Users]
      summary: Update salary (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Salary updated

  /employeesAttendance:
    get:
      tags: [Users]
      summary: Get active employees list
      description: >
        Bank account numbers, IFSC, UPI, and account holder names are masked for
        non-admin callers. `bankDetails.officeBranch` is kept for attendance office matching.
      responses:
        '200':
          description: Employee list

  /attendance:
    post:
      tags: [Attendance]
      summary: Mark check-in / check-out
      description: >
        Check-in enforces profile completion. Incomplete profiles receive a warning
        (`profileIncomplete: true`) but check-in is still allowed during a 3-day
        internal grace period. After 3 days without completing the profile, check-in
        is rejected with `code: ATTENDANCE_LOCKED` until an admin unlocks the user.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                type:
                  type: string
                  enum: [check-in, check-out]
                location:
                  type: string
                  description: "lat,lon"
                comment:
                  type: string
      responses:
        '200':
          description: Attendance recorded (may include profileIncomplete warning on check-in)
        '403':
          description: Attendance locked due to incomplete profile after grace period
        '409':
          description: >
            Duplicate or invalid attendance for today (already checked in/out,
            checkout without check-in, or day already complete). Response includes
            `code` such as DUPLICATE_CHECK_IN, DUPLICATE_CHECK_OUT,
            CHECKOUT_WITHOUT_CHECKIN, or ATTENDANCE_DAY_COMPLETE.

  /attendance/me:
    get:
      tags: [Attendance]
      summary: My attendance records
      responses:
        '200':
          description: Attendance history

  /attendance/last:
    get:
      tags: [Attendance]
      summary: Last attendance record
      responses:
        '200':
          description: Last record

  /attendance/all:
    get:
      tags: [Attendance]
      summary: All attendance (admin)
      responses:
        '200':
          description: All records

  /attendance/date/{date}:
    get:
      tags: [Attendance]
      summary: Attendance by date (admin)
      parameters:
        - name: date
          in: path
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Records for date

  /attendance/user/{userId}:
    get:
      tags: [Attendance]
      summary: Attendance by user (admin)
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: User attendance

  /attendance/user/{userId}/last:
    get:
      tags: [Attendance]
      summary: Last attendance for user (admin)
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Last record

  /attendance/user/{userId}/summary/{year}/{month}:
    get:
      tags: [Attendance]
      summary: Monthly summary (admin)
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
        - name: year
          in: path
          required: true
          schema: { type: integer }
        - name: month
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Monthly summary

  /api/admin/summary:
    get:
      tags: [Admin]
      summary: Dashboard summary
      responses:
        '200':
          description: Stats

  /api/admin/recent-attendance:
    get:
      tags: [Admin]
      summary: Recent attendance logs
      responses:
        '200':
          description: Recent logs

  /api/admin/recent-dashboard:
    get:
      tags: [Admin]
      summary: Recent dashboard activity
      responses:
        '200':
          description: Recent activity

  /api/admin/pending-users:
    get:
      tags: [Admin]
      summary: Pending registrations
      responses:
        '200':
          description: Pending users

  /api/admin/approve/{id}:
    post:
      tags: [Admin]
      summary: Approve pending user
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: User approved

  /api/admin/reject/{id}:
    delete:
      tags: [Admin]
      summary: Reject pending user
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: User rejected

  /api/admin/letters:
    get:
      tags: [Admin]
      summary: All uploaded letters
      responses:
        '200':
          description: Letters list

  /api/admin/users/{id}/unlock-attendance:
    post:
      tags: [Admin]
      summary: Unlock attendance for a locked user
      description: Admin-only. Clears profile attendance lock and missed-day In-Out lock. Employees cannot unlock themselves.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: User attendance unlocked
        '403':
          description: Forbidden (non-admin)
        '404':
          description: User not found

  /api/leaves/apply:
    post:
      tags: [Leaves]
      summary: Apply for leave
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Leave applied

  /api/leaves/me:
    get:
      tags: [Leaves]
      summary: My leave requests
      responses:
        '200':
          description: My leaves

  /api/leaves/all:
    get:
      tags: [Leaves]
      summary: All leave requests (admin)
      responses:
        '200':
          description: All leaves

  /api/leaves/{id}:
    patch:
      tags: [Leaves]
      summary: Update leave status (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
      responses:
        '200':
          description: Leave updated

  /api/holidays:
    get:
      tags: [Holidays]
      summary: Get all holidays (admin)
      description: Requires a Bearer JWT with admin role.
      responses:
        '200':
          description: Holiday list
        '401':
          description: Missing or invalid token
        '403':
          description: Not an admin
    post:
      tags: [Holidays]
      summary: Add holiday (admin)
      description: Requires a Bearer JWT with admin role.
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Holiday added
        '401':
          description: Missing or invalid token
        '403':
          description: Not an admin

  /api/holidays/filter:
    get:
      tags: [Holidays]
      summary: Filter holidays (admin)
      description: Requires a Bearer JWT with admin role.
      responses:
        '200':
          description: Filtered holidays
        '401':
          description: Missing or invalid token
        '403':
          description: Not an admin

  /api/holidays/update/{id}:
    put:
      tags: [Holidays]
      summary: Update holiday (admin)
      description: Requires a Bearer JWT with admin role.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Holiday updated
        '401':
          description: Missing or invalid token
        '403':
          description: Not an admin

  /api/holidays/delete/{id}:
    delete:
      tags: [Holidays]
      summary: Delete holiday (admin)
      description: Requires a Bearer JWT with admin role.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Holiday deleted
        '401':
          description: Missing or invalid token
        '403':
          description: Not an admin

  /api/tasks:
    post:
      tags: [Tasks]
      summary: Create task
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Task created

  /api/tasks/summary:
    get:
      tags: [Tasks]
      summary: Task summary
      responses:
        '200':
          description: Summary counts

  /api/tasks/month/{year}/{month}:
    get:
      tags: [Tasks]
      summary: Tasks by month
      parameters:
        - name: year
          in: path
          required: true
          schema: { type: integer }
        - name: month
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Monthly tasks

  /api/tasks/{date}:
    get:
      tags: [Tasks]
      summary: Tasks by date
      parameters:
        - name: date
          in: path
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Tasks for date

  /api/tasks/{id}:
    patch:
      tags: [Tasks]
      summary: Update task status
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Status updated
    put:
      tags: [Tasks]
      summary: Update full task
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Task updated
    delete:
      tags: [Tasks]
      summary: Delete task
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Task deleted

  /schedules:
    get:
      tags: [Schedules]
      summary: Get all schedules (admin)
      description: Requires a Bearer JWT with admin role.
      responses:
        '200':
          description: Schedule list
        '401':
          description: Missing or invalid token
        '403':
          description: Not an admin

  /schedules/{id}:
    put:
      tags: [Schedules]
      summary: Update user schedule (admin)
      description: Requires a Bearer JWT with admin role.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Schedule updated
        '401':
          description: Missing or invalid token
        '403':
          description: Not an admin

  /api/payslips:
    get:
      tags: [Payslips]
      summary: Get payslips
      description: |
        Requires a Bearer JWT.
        Admins receive all payslips. Employees receive only their own.
      responses:
        '200':
          description: Payslip list
        '401':
          description: Missing or invalid token
    post:
      tags: [Payslips]
      summary: Create payslip
      description: Requires a Bearer JWT with admin role.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [userId, employeeId, month, year]
              properties:
                userId: { type: string }
                employeeId: { type: string }
                month: { type: string }
                year: { type: integer }
      responses:
        '201':
          description: Payslip created
        '400':
          description: Missing required fields
        '401':
          description: Missing or invalid token
        '403':
          description: Not an admin

  /uploads/{filename}:
    get:
      tags: [Uploads]
      summary: Get uploaded file
      security: []
      parameters:
        - name: filename
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: File content
